<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No connection · Tobacco Floor</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #faf5ec; color: #2b1d12; padding: 24px; box-sizing: border-box; }
      @media (prefers-color-scheme: dark) { body { background: #17110c; color: #f3e9da; } }
      main { max-width: 22rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.4rem; margin: 16px 0 8px; }
      p { color: #7b6853; line-height: 1.5; }
      button { margin-top: 12px; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 1rem; font-weight: 600; background: #8a4a1f; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Can't reach the floor server</h1>
      <p>Check the Wi-Fi on this device. Nothing was saved while offline, so scan the bale again once you're back.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
